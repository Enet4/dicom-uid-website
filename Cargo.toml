[package]
name = "dicom-uid-website"
publish = false
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
dicom-gen-uid = "0.2.0"

[dependencies.uuid]
version = "1.23.1"
features = ["rng-getrandom"]

[dependencies.getrandom]
version = "0.4"
features = ["wasm_js"]

[dependencies.wasm-bindgen]
version = "=0.2.122"
features = []

[profile.release]
opt-level = 's'
lto = 'fat'
codegen-units = 1
